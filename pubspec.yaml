name: fast_mask
description: A desktop utility for quickly masking text while preserving the original.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  characters: ^1.4.1
  flutter:
    sdk: flutter
  hotkey_manager: ^0.2.3
  shared_preferences: ^2.5.3
  tray_manager: ^0.5.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray_icon.png
    - assets/tray_icon.ico
